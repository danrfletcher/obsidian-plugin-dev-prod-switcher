name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Cryptographically ties main.js/styles.css back to this repo + workflow
      # run, so users (and Obsidian's own review) can verify the published
      # assets were actually built from the source visible here.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "main.js, styles.css"

      - name: Package and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
